[project]
name = "tracking-clipper"
version = "0.1.0"
description = "Scrub, clip and share SkillCorner tracking data like video."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "orjson>=3.10",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
